       EDITOR PANEL
  ====================================================== -->

    <div class="controls-head">

      <h1>
        খতিয়ান ম্যানুয়াল এডিটর
      </h1>

      <p>
        আগের খতিয়ানের তথ্য স্বয়ংক্রিয়ভাবে বসবে।
        প্রয়োজনীয় বাকি তথ্য নিজের মতো লিখতে পারবেন।
      </p>

      <div id="load-status"></div>

    </div>


    <div class="form-grid">


      <label class="wide">
        শিরোনাম

        <textarea
          id="titleText"
          rows="2"
          placeholder="যেমন: আর এস (জোনাল) খতিয়ান নং- ৩০২"
        ></textarea>
      </label>

        পৃষ্ঠা তথ্য

          rows="2"

      </label>


      <label>
        বিভাগ

        <textarea
          id="division"
          rows="2"
        >চট্টগ্রাম</textarea>
      </label>


      <label>
        জেলা

        <textarea
          id="district"
          rows="2"

      </label>


      <label>
        উপজেলা/থানা

          id="upazila"
          rows="2"

      </label>


      <label>
        মৌজা

          id="mouza"
          rows="2"

      </label>

        জে. এল. নং

          rows="2"

      </label>

        রেঃ সা. নং

          id="revisionNo"

      </label>


      <label>
        মালিক

          id="owner"

        ></textarea>
      </label>


      <label>
        অংশ

          id="share"
          rows="2"
        ></textarea>
      </label>


      <label>
        রাজস্ব

          id="revenue"
          rows="2"
        ></textarea>
      </label>


      <label>
        দাগ

          id="dag"
          rows="2"
        ></textarea>
      </label>


      <label>
        কৃষি

          id="agri"
          rows="2"
        ></textarea>
      </label>


      <label>
        অকৃষি

          rows="2"
        ></textarea>
      </label>


      <label>
        দাগের মোট পরিমাণ — একর

        <textarea
          id="dagTotalAcre"
          rows="2"

      </label>


      <label>
        দাগের মোট পরিমাণ — শতাংশ

        <textarea
