<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>অ্যাডমিন প্যানেল — খতিয়ান</title><link rel="stylesheet" href="style.css">
  <style>
    body{background:#f3f5f8}.admin-wrap{max-width:720px;margin:50px auto;padding:20px}.admin-card{background:#fff;border-radius:10px;box-shadow:0 3px 15px #0001;padding:28px}.admin-card h1{margin:0 0 22px;color:#087a3d;font-size:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-weight:700}.field input{padding:11px 12px;border:1px solid #ccc;border-radius:6px;font:inherit}.btns{display:flex;gap:10px;margin-top:20px}.btn{border:0;border-radius:6px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#087a3d;color:#fff}.secondary{background:#eee}.msg{margin:12px 0;padding:10px;border-radius:6px;display:none}.ok{display:block;background:#e5f8ea;color:#087a3d}.err{display:block;background:#ffe9e9;color:#a40000}.muted{color:#666;font-size:14px;margin-bottom:15px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="admin-wrap">
  <div class="admin-card" id="login-card">
    <h1>অ্যাডমিন লগইন</h1><p class="muted">শুধু অনুমোদিত অ্যাডমিন এখানে তথ্য পরিবর্তন করতে পারবেন।</p>
    <div class="field"><label>ইমেইল</label><input id="email" type="email" autocomplete="username"></div><br>
    <div class="field"><label>পাসওয়ার্ড</label><input id="password" type="password" autocomplete="current-password"></div>
    <div id="login-msg" class="msg"></div><div class="btns"><button class="btn primary" id="login">লগইন</button><a href="index.html"><button type="button" class="btn secondary">হোম</button></a></div>
  </div>
  <div class="admin-card" id="editor-card" style="display:none">
    <h1>খতিয়ান তথ্য পরিবর্তন</h1><p class="muted">এখানে Save করলে মূল ওয়েবসাইটের তথ্য আপডেট হবে।</p>
    <div class="grid">
      <div class="field"><label>খতিয়ান নং</label><input id="f_khatian"></div>
      <div class="field"><label>মালিক</label><input id="f_owner"></div>
      <div class="field"><label>দাগ নং</label><input id="f_dag_no"></div>
      <div class="field"><label>সার্ভে</label><input id="f_survey"></div>
      <div class="field"><label>মৌজা</label><input id="f_mouza"></div>
      <div class="field"><label>উপজেলা</label><input id="f_upazila"></div>
      <div class="field"><label>জেলা</label><input id="f_district"></div>
      <div class="field"><label>বিভাগ</label><input id="f_division"></div>
      <div class="field full"><label>তারিখ</label><input id="f_record_date"></div>
    </div>
    <div id="save-msg" class="msg"></div><div class="btns"><button class="btn primary" id="save">Save / Update</button><button class="btn secondary" id="logout">লগআউট</button><a href="index.html"><button type="button" class="btn secondary">ওয়েবসাইট দেখুন</button></a></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script>
</body></html>
